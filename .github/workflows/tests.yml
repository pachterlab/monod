name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (py${{ matrix.python }}, ${{ matrix.rust && 'rust' || 'pure python' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", rust: true }
          - { python: "3.12", rust: true }
          - { python: "3.11", rust: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Python package
        run: python -m pip install -e ".[test]"
      - name: Install Rust and HDF5
        if: matrix.rust
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config
      - name: Build monod_core
        if: matrix.rust
        working-directory: monod_core
        run: |
          python -m pip install maturin patchelf
          maturin develop --release
      - name: Run the test suite
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest tests/ -q -p no:cacheprovider
