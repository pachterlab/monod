name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (py${{ matrix.python }}, ${{ matrix.rust && 'rust' || 'pure python' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", rust: true }
          - { python: "3.12", rust: true }
          - { python: "3.11", rust: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Python package
        # the annotate plugin turns each failing test into a GitHub annotation
        # (visible in the UI and via the API), so failures are readable without the raw log
        run: python -m pip install -e ".[test]" pytest-github-actions-annotate-failures
      - name: Install Rust and HDF5
        if: matrix.rust
        run: |
          rustup toolchain install stable --profile minimal
          sudo apt-get update && sudo apt-get install -y libhdf5-dev pkg-config
      - name: Build and install monod_core
        if: matrix.rust
        # pip drives maturin as a PEP 517 backend; unlike `maturin develop` this does
        # not require a virtualenv, which the runner's setup-python interpreter is not.
        run: |
          python -m pip install -v ./monod_core
          python -c "import monod_core; print('monod_core OK')"
      - name: Run the test suite
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: python -m pytest tests/ -q -ra --tb=short -p no:cacheprovider
